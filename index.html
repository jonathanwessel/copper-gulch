<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copper Gulch</title>
<meta name="description" content="A free Old West tycoon and tower-defense game. No ads, no purchases, no tracking.">
<style>
  :root { --bg: #2a1d17; --panel: #3b2a20; --line: #160f0b; --ink: #ece6d8; --gold: #e8b54a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  .sign { background: var(--panel); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--line); padding: 20px 24px; max-width: 420px; text-align: center; }
  h1 { margin: 0 0 8px; color: var(--gold); font-size: 1.8rem; letter-spacing: .04em; }
  p { margin: 0; }
</style>
</head>
<body>
<main><div class="sign"><h1>Copper Gulch</h1><p>The town is being rebuilt. The first playable build is on its way.</p></div></main>
</body>
</html>
