<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Copper Gulch</title>
<meta name="description" content="A free Old West tycoon and tower-defense game. No ads, no purchases, no tracking.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#2a1d17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Copper Gulch">
<style>
/* A crisp, flat pixel interface: flat fills, hard 2px borders, pixel bevels and hard drop shadows. No gradients or glass. */
:root {
  color-scheme: dark;
  --bg: #2a1d17;      /* dusk over the gulch */
  --panel: #3b2a20;
  --panel-2: #4a3527;
  --line: #160f0b;
  --bevel: #6b4c36;
  --ink: #f1e8d6;
  --muted: #c2ad90;
  --copper: #e38d4e;
  --copper-hi: #ffc58f;
  --copper-lo: #a95a2c;
  --gold: #f0c14a;
  --good: #8fd57a;
  --bad: #f07067;
  --ui: ui-rounded, "Trebuchet MS", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; touch-action: none; } /* only the map zooms, never the page (owner); sheets that scroll set their own */
body {
  overflow: hidden; background: var(--bg); color: var(--ink);
  font: 600 16px/1.35 var(--ui); font-variant-numeric: tabular-nums;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
html.no3d #view { display: none; }
html.no3d body { background: var(--bg); }
#app { position: fixed; inset: 0; overflow: hidden auto; }

/* --- the title ---------------------------------------------------------------------------------------------------- */
.title {
  min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: max(28px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.head { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.logo { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 4vh; animation: drop .7s cubic-bezier(.2, 1.4, .4, 1) both; }
.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.tagline {
  margin: 0; padding: 4px 10px; background: var(--line); color: var(--copper-hi); letter-spacing: .04em; font-size: .95rem;
  box-shadow: 3px 3px 0 rgba(22, 15, 11, .5); animation: rise .5s .25s both;
}
.sign {
  margin-top: auto; width: min(100%, 380px); padding: 14px; display: grid; gap: 10px; text-align: center;
  background: var(--panel); border: 2px solid var(--line);
  box-shadow: inset 2px 2px 0 var(--bevel), inset -2px -2px 0 #24170f, 4px 4px 0 rgba(22, 15, 11, .6);
  animation: rise .5s .4s both;
}
.note { margin: 0; color: var(--muted); font-size: .9rem; }
.row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.btn {
  min-height: 44px; padding: 8px 16px; border: 2px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer;
  box-shadow: inset 2px 2px 0 var(--bevel), inset -2px -2px 0 #24170f, 2px 2px 0 var(--line);
  transition: transform .06s, filter .15s;
}
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: inset 2px 2px 0 #24170f; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn:disabled { opacity: .55; cursor: default; }
.btn.primary { background: var(--copper); color: #1d120c; font-size: 1.25rem; letter-spacing: .06em; box-shadow: inset 2px 2px 0 var(--copper-hi), inset -2px -2px 0 var(--copper-lo), 2px 2px 0 var(--line); }
/* a primary button that cannot be pressed now is flat and gray, never a dimmed bright orange (clarity fix 8n: Call to arms
   read as pressable while its card said Ready in 4:14) */
.btn.primary:disabled { background: #4a3f37; color: #a89a88; opacity: 1; box-shadow: inset 2px 2px 0 #5a4e45, inset -2px -2px 0 #362d27, 2px 2px 0 var(--line); }
.btn.small { min-height: 34px; padding: 4px 12px; font-size: .85rem; }
.btn.timer { min-width: 7.2em; font-variant-numeric: tabular-nums; }
.install { display: contents; }
.install .hint { font-size: .8rem; color: var(--muted); font-weight: 500; flex-basis: 100%; }
.foot { margin: 0; padding: 3px 8px; background: rgba(22, 15, 11, .82); color: #e6d6bd; font-size: .75rem; text-align: center; box-shadow: 2px 2px 0 rgba(22, 15, 11, .5); } /* a dark pill, so it reads on any sky or sand (review of 2026.11.21-2) */

/* --- the update bar ------------------------------------------------------------------------------------------------ */
.updatebar {
  position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20;
  width: min(92vw, 380px); min-height: 48px; display: grid; gap: 2px; padding: 8px 12px; text-align: left;
  background: var(--gold); color: #1d120c; border: 2px solid var(--line); box-shadow: 3px 3px 0 var(--line); cursor: pointer;
  animation: riseX .4s both;
}
.updatebar span { font-size: .8rem; font-weight: 500; }

/* --- the play screen ------------------------------------------------------------------------------------------ */
#app:has(.play) { pointer-events: none; overflow: hidden; }
.play { position: absolute; inset: 0; pointer-events: none; }
/* only real buttons and cards take taps: the top bar's band, the goods bar's gaps and toasts let taps through to the map
   (owner: towers were hard to tap, depending on where they were; the top bar as tall as the side buttons ate them) */
.play .card, .play .tag { pointer-events: auto; }
.hud {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  padding: max(8px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left));
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.townname { padding: 4px 10px; background: var(--line); color: var(--copper-hi); font-size: .9rem; letter-spacing: .04em; box-shadow: 3px 3px 0 rgba(22, 15, 11, .5); white-space: nowrap; }
.coins {
  display: flex; align-items: center; gap: 6px; padding: 6px 10px; min-height: 36px; background: var(--panel); border: 2px solid var(--line);
  box-shadow: inset 2px 2px 0 var(--bevel), inset -2px -2px 0 #24170f, 3px 3px 0 rgba(22, 15, 11, .5);
}
/* live numbers keep fixed cells (owner rule): room for the widest the formatter makes (fmtLive: "99.9K"), right-aligned */
.coins b { font-size: 1.15rem; color: var(--gold); min-width: 5ch; }
.coins .inc { font-size: .8rem; color: var(--good); min-width: 7.5ch; }
.coin { width: 14px; height: 14px; background: var(--gold); border: 2px solid #7a5a12; box-shadow: inset -2px -2px 0 #c99a2a; flex: none; }
.hudleft { display: grid; gap: 6px; align-self: start; align-content: start; justify-items: start; pointer-events: none; flex: 1 1 0; min-width: 0; }
.hudleft > .wave { max-width: 100%; min-width: 0; }
.hudleft > * { pointer-events: auto; }
.wave {
  display: flex; align-items: center; gap: 8px; padding: 4px 6px 4px 10px; min-height: 36px; background: var(--panel); border: 2px solid var(--line);
  box-shadow: inset 2px 2px 0 var(--bevel), inset -2px -2px 0 #24170f, 3px 3px 0 rgba(22, 15, 11, .5); font-size: .85rem;
}
.wave b { color: var(--copper-hi); white-space: nowrap; display: inline-block; width: 8ch; text-align: left; } /* one width from "Wave 1" to "Wave 999" */
.wave .vaultbtn { min-width: 32px; justify-content: center; }
.wavebtn { flex: none; min-height: 30px; padding: 0; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
.explain.why .oldwave { flex: none; padding: 0 5px; line-height: 1.2; color: var(--gold); font-weight: bold; background: rgba(0, 0, 0, .35); border: 1px solid rgba(0, 0, 0, .5); } /* the wave bar's gold number, in the tower card's row (review of 2026.11.23-9) */
.wave.old b { color: var(--gold); } /* towers hit harder on waves beaten before (the tower card's "Beaten waves" row) */
.vault { width: 44px; height: 10px; background: var(--line); border: 1px solid #000; display: block; }
.heart { display: inline-block; width: 14px; height: 12px; flex: none; color: #d8483a; } /* the vault's mark (src/ui/heart.js) */
.heart svg { display: block; width: 100%; height: 100%; fill: currentColor; }
.vnum { display: inline-block; width: 5ch; font-size: .85rem; line-height: 1; text-align: left; font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; } /* the hits it can take, at most 5 characters, one width (src/ui/format.js vaultCount) */
.vnum.low { color: var(--bad); }
.vault i { display: block; height: 100%; background: var(--good); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
.winfo { color: var(--muted); white-space: nowrap; overflow: hidden; min-width: 0; flex: none; width: 5.6em; text-align: center; } /* one width whatever it says: in 28s, On hold, Fighting */
.hudrow { display: flex; gap: 6px; pointer-events: none !important; } /* only its buttons take taps, never the gap between them */
.hudrow > * { pointer-events: auto; }
/* the place bar: the town's name, Map, and one back button to the last place (owner rule: it never grows with the towns) */
.place { display: flex; gap: 6px; align-items: center; max-width: 100%; min-width: 0; min-height: 34px; pointer-events: none; } /* as tall as its buttons, so the wave bar never drops when Map appears */
.place > * { pointer-events: auto; }
.place .townname { pointer-events: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
.place .btn { flex: none; min-height: 34px; padding: 4px 10px; white-space: nowrap; }
.place .backbtn { flex: 0 1 auto; min-width: 0; max-width: 11em; overflow: hidden; text-overflow: ellipsis; }
.place .backbtn.dot { padding-right: 16px; } /* its dot sits inside, since the name clips (it was cut off unseen until clarity fix 5 gave it more to say) */
.place .backbtn.dot::after { top: 3px; right: 3px; width: 8px; height: 8px; border-width: 1px; }
.backbtn::before { content: ""; display: inline-block; width: 6px; height: 10px; margin-right: 6px; background: currentColor; clip-path: polygon(100% 0, 100% 100%, 0 50%); vertical-align: -1px; }
.place .btn[hidden], .townname[hidden] { display: none; }
/* a phone: tighter boxes so "Copper Gulch", Map and "Dry Creek" fit beside the coins */
@media (max-width: 480px) {
  .place { gap: 4px; }
  .place .townname { padding: 4px 6px; letter-spacing: 0; }
  .place .btn { padding: 4px 7px; }
  .place .backbtn::before { margin-right: 4px; }
  .place.tight .townname, .place.tight .btn { font-size: .76rem; } /* two long names: smaller type before any name is cut (src/ui/play.js, fitPlace) */
  .place.tight .btn { padding: 4px 6px; }
  .place.tight .backbtn.dot { padding-right: 14px; }
}
.hudrow .btn { min-height: 34px; padding: 4px 10px; white-space: nowrap; }
.hudrow .btn.on { background: var(--gold); color: #1d120c; box-shadow: inset 2px 2px 0 #ffe08a, inset -2px -2px 0 #a8801a, 2px 2px 0 var(--line); }
.pausedbanner {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); padding: 8px 18px; pointer-events: none;
  background: var(--line); color: var(--copper-hi); font-size: 1.4rem; letter-spacing: .1em; border: 2px solid var(--copper);
  box-shadow: 4px 4px 0 rgba(22, 15, 11, .6);
}
.wave .call { min-height: 30px; padding: 2px 8px; white-space: nowrap; flex: none; }
.wave .vaultbtn { flex: none; } /* only the countdown gives way on a narrow screen, never Call now */
.wave .call.away { visibility: hidden; } /* during a wave Call now keeps its place, so the bar keeps one width */
/* the boss bar (src/ui/boss.js): one width, its numbers in fixed cells, at the foot of the left column */
.bossbar {
  display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; gap: 8px; width: min(100%, 300px); min-height: 40px; padding: 3px 8px 3px 4px;
  background: var(--line); color: var(--ink); border: 2px solid var(--bad); box-shadow: 3px 3px 0 rgba(22, 15, 11, .5); font: inherit; font-size: .8rem; line-height: 1.15; text-align: left; cursor: pointer;
}
.bossbar[hidden] { display: none; }
.bossbar .foepic { display: block; width: 28px; height: 28px; image-rendering: pixelated; }
.bossbar .btext { display: grid; gap: 3px; min-width: 0; }
.bossbar .brow { display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 16px; } /* the stage picture is 16 px, so the bar keeps one height with it, before it and once the boss is down */
.bossbar .bname { flex: 1 1 auto; min-width: 0; color: var(--copper-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bossbar .bstage { flex: none; width: 34px; height: 16px; display: inline-flex; align-items: center; justify-content: flex-end; gap: 2px; }
.bossbar .bstage .foepic.small { width: 16px; height: 16px; }
.bossbar .spic { display: block; flex: none; width: 14px; height: 14px; }
.bossbar .spic.plates { background: linear-gradient(135deg, transparent 44%, var(--bad) 44%, var(--bad) 58%, transparent 58%), #a9adb5; clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); }
.bossbar .spic.steam { background: radial-gradient(circle at 30% 65%, #eef1f4 30%, transparent 32%), radial-gradient(circle at 62% 45%, #eef1f4 34%, transparent 36%), radial-gradient(circle at 78% 72%, #d6dbe0 24%, transparent 26%); }
.bossbar .fbar { flex: 1 1 auto; min-width: 40px; height: 10px; }
.bossbar .fbar i { background: var(--bad); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
.bossbar .bnum { flex: none; width: 13.5ch; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.bossbar .barmor { flex: none; display: inline-flex; align-items: center; gap: 3px; width: auto; white-space: nowrap; font-variant-numeric: tabular-nums; color: #c8ccd4; }
.bossbar .abar { flex: none; width: 36px; min-width: 0; height: 10px; }
.bossbar .abar i { background: #d6dae0; }
.bossbar .abar u { background: repeating-linear-gradient(135deg, #5a8a3a 0 3px, #2f4a20 3px 6px); } /* what poison ate, as on the raider card */
.bossbar .shield { display: block; width: 8px; height: 10px; background: #a9adb5; clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); flex: none; }
.bossbar.gone { border-color: var(--good); }
.bossbar.gone .bname { color: var(--good); }
.bossbar.gone .bstage, .bossbar.gone .fbar, .bossbar.gone .bnum, .bossbar.gone .barmor { visibility: hidden; } /* only its name line, "War wagon down!", which takes the row */
.bossbar.gone .bstage { display: none; }
/* the goal strip and its spotlight (src/core/goals.js) */
.goal {
  display: flex; align-items: center; gap: 8px; width: min(100%, 340px); min-height: 34px; padding: 3px 10px 3px 3px; text-align: left; cursor: pointer;
  background: var(--line); color: var(--ink); border: 2px solid var(--copper); box-shadow: 3px 3px 0 rgba(22, 15, 11, .5); font: inherit; font-size: .85rem; line-height: 1.2;
}
.goal[hidden] { display: none; }
.goal .glabel { flex: none; padding: 3px 6px; background: var(--copper); color: #1d120c; font-size: .75rem; font-weight: 700; letter-spacing: .04em; }
.goal .gtext { min-width: 0; text-wrap: balance; }
.goal.new { animation: slideIn .3s both; } /* slides in solid: a fade read as see-through (review of 2026.11.20-5) */
.goal.done { border-color: var(--good); }
.goal.done .glabel { background: var(--good); }
.goal.done .gtext { color: var(--good); }
.goalmark { position: absolute; left: 0; top: 0; pointer-events: none; border: 3px solid var(--gold); box-shadow: 0 0 0 2px var(--line), inset 0 0 0 2px var(--line); will-change: transform; }
.goalmark[hidden] { display: none; }
.goalmark::after { content: ""; position: absolute; inset: -4px; border: 2px solid var(--gold); animation: markPulse 1.1s ease-out infinite; }
.goalmark.ping { animation: markPing .45s 3; }
.goalmark.ontag { border: 0; box-shadow: none; }
.goalmark.onel { border-width: 2px; box-shadow: 0 0 0 1px var(--line); } /* on a button: snug, its pulse stays within 3px, so the next button and its dot stay clear */
.goalmark.onel::after { inset: -2px; animation: markPulseEl 1.1s ease-out infinite; }
/* on a button the mark is white and dashed, never the gold of a switch that is on (review of 2026.11.23-8: the gold
   border round Hold waves read as the button switched on) */
.goalmark.onel { border-color: #fff8e6; border-style: dashed; }
.goalmark.onel::after { border-color: #fff8e6; }
@keyframes markPulseEl { from { inset: -2px; opacity: .9; } to { inset: -5px; opacity: 0; } }
.goalmark.onpad, .goalmark.onpad::after { border-radius: 50%; } /* on a stone pad: a ring lying on it as the camera sees it (review of 2026.11.20-7) */
.goalmark.ontag::after { display: none; } /* on a tag the tag itself pulses: a ring round it read as an extra box (review of 2026.11.20-4) */
.tag.goaltag { border-color: var(--gold); animation: goalTag 1.1s ease-in-out infinite; }
@keyframes goalTag { 50% { border-color: #fff1b8; box-shadow: 0 0 0 2px rgba(255, 241, 184, .35), 2px 2px 0 rgba(22, 15, 11, .6); } } /* the border glows, the fill stays: a brown fill under dark text read as faded (review of 2026.11.20-6 shots) */
@media (prefers-reduced-motion: reduce) { .tag.goaltag { animation: none; } }
@keyframes markPulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
@keyframes markPing { 50% { border-color: #fff8dc; border-width: 5px; } }
@media (max-width: 420px) { .wave { gap: 5px; padding-left: 8px; } .vault { width: 30px; } .wave .call { padding: 2px 6px; } .winfo { width: 5.2em; }
  /* a phone: the coin rate goes under the coins, in one fixed column, so the wave chip keeps room for its countdown */
  .coins { display: grid; grid-template-columns: auto 3.7rem; column-gap: 6px; row-gap: 0; padding: 3px 8px; }
  .coins .coin { grid-row: 1 / 3; }
  .coins b, .coins .inc { min-width: 0; line-height: 1.1; white-space: nowrap; overflow: hidden; }
}
.option { display: flex; align-items: center; gap: 10px; padding: 6px 8px; background: var(--panel-2); border: 2px solid var(--line); }
.option > div { display: grid; flex: 1; gap: 1px; }
.option b { color: var(--copper-hi); }
.option span { font-size: .85rem; font-weight: 500; }
.option small { color: var(--gold); font-size: .8rem; }
/* a research item's levels as pips, filled when done (clarity fix 8n) */
.option .rhead { display: flex; align-items: center; gap: 8px; font-size: inherit; font-weight: inherit; } /* a research item's name with its level pips beside it */
.option .pips { display: inline-flex; gap: 3px; }
.option .pips[hidden] { display: none; }
.option .pips i { display: block; width: 9px; height: 9px; border: 1px solid var(--gold); background: transparent; }
.option .pips i.on { background: var(--gold); }
.option .build { flex: none; }
.option .foepic { flex: none; width: 28px; height: 28px; image-rendering: pixelated; } /* a raider's picture, 2x its pixels */
/* the raider card (src/ui/foe.js): its picture and name, health and armor bars with numbers in fixed cells, the effects
   on it as small chips with a mark, a word and the seconds left */
.foecard .cardhead .foepic { flex: none; width: 36px; height: 36px; image-rendering: pixelated; }
.foestat { display: grid; grid-template-columns: 4.4em minmax(0, 1fr) 13.5ch; min-width: 0; align-items: center; gap: 8px; min-height: 26px; font-size: .9rem; }
.foestat .flabel { color: var(--muted); }
.foestat b { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--ink); }
.fbar { position: relative; display: block; height: 12px; background: var(--line); border: 1px solid #000; overflow: hidden; }
.fbar i, .fbar u { position: absolute; left: 0; top: 0; bottom: 0; display: block; text-decoration: none; }
.foestat.hp .fbar i { background: var(--bad); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
.foestat.ar .fbar i { background: #a9adb5; box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); }
.foestat.ar .fbar u { background: repeating-linear-gradient(135deg, #5a8a3a 0 3px, #2f4a20 3px 6px); } /* what poison ate off the armor */
.foefx { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; min-height: 26px; }
.foefx .fx { display: flex; align-items: center; gap: 6px; min-height: 26px; padding: 2px 6px; background: var(--panel-2); border: 2px solid var(--line); font-size: .85rem; }
.foefx .fxword { flex: 1; white-space: nowrap; }
.foefx .fx[data-fx="stage"] { grid-column: 1 / -1; } /* a boss's stage is a sentence across the card (clarity fix 8b) */
.foefx .fx[data-fx="stage"] .fxword { white-space: normal; }
.foefx .fx[data-fx="stage"] .fxleft { display: none; }
.foefx .fxleft { flex: none; width: 6ch; text-align: right; color: var(--copper-hi); font-variant-numeric: tabular-nums; white-space: nowrap; }
.foefx .fxnone { grid-column: 1 / -1; align-self: center; color: var(--muted); font-size: .85rem; }
.fxmark { flex: none; display: block; width: 14px; height: 14px; }
.fxmark svg { display: block; width: 100%; height: 100%; }
.fx-frozen { fill: #b8ecff; } .fx-poison { fill: #8fd57a; } .fx-rot { fill: #c8d88a; } .fx-spread { fill: #a6e07a; }
.fx-fire { fill: #ff8a2a; } .fx-slow { fill: #9cc4ff; } .fx-brittle { fill: #e8dcc8; } .fx-stage { fill: #e8c050; }
.card > p.gone { color: var(--gold); font-size: .85rem; line-height: 1.3; } /* in place of the coins line, the same height */
.foecard.gonefoe .foestat, .foecard.gonefoe .foefx { opacity: .55; }
.workercard .foestat { grid-template-columns: minmax(0, 1fr) 13.5ch; }

.tags { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* quiet tags: a small dark pill in a clear 30 px tap box (owner, 2026-11-19); the full tag above is only for the goal,

html.flat .tags { position: absolute; inset: 64px 12px auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }

.card {
  position: absolute; left: 50%; bottom: calc(max(10px, env(safe-area-inset-bottom)) + var(--striph, 0px)); transform: translateX(-50%);
  width: min(calc(100% - 20px), 420px); padding: 12px; display: grid; gap: 8px;
  max-height: calc(100% - var(--hudtop, 10px) - max(10px, env(safe-area-inset-bottom)) - var(--striph, 0px)); overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y;
  background: var(--panel); border: 2px solid var(--line);
  box-shadow: inset 2px 2px 0 var(--bevel), inset -2px -2px 0 #24170f, 4px 4px 0 rgba(22, 15, 11, .6);
  animation: riseX .2s both;
}
/* a card in the town leaves a band of map above it, so the pad, tower or building it is open for shows there (review
   of 2026.11.20-4: the stone pad card filled a phone and hid which pad was tapped) */
@media (orientation: portrait), (min-height: 501px) {
  .play .card { max-height: calc(100% - var(--hudtop, 10px) - 130px - max(10px, env(safe-area-inset-bottom)) - var(--striph, 0px)); }
}
/* a wide screen has room beside the card, where the camera puts what it is open for, so the card takes the height and
   does not scroll (clarity fix 8c: a level 19 tower card scrolled on a desktop under 130 px of empty map) */
@media (min-width: 1000px) and (min-height: 501px) {
  .play .card { max-height: calc(100% - var(--hudtop, 10px) - max(10px, env(safe-area-inset-bottom)) - var(--striph, 0px)); }
}
.cardhead > .sellhead { display: inline-flex; white-space: nowrap; flex: none; }
.sellhead { align-items: center; }
.sellhead .coin { width: 10px; height: 10px; margin: 0 5px 0 6px; }
.cardhead { display: flex; align-items: center; gap: 8px; position: sticky; top: -12px; margin: -12px -12px 0; padding: 12px 12px 4px; background: var(--panel); z-index: 1; }
@media (orientation: landscape) and (max-height: 500px) {
  .card { left: auto; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); transform: none; width: min(46%, 400px); animation-name: rise; max-height: calc(100% - var(--cardtop, 10px) - max(10px, env(safe-area-inset-bottom))); }
  /* a short screen: the town name, the wave and Pause share one row, the goal goes under them, so the town gets the height */
  .hudleft { grid-template-columns: auto auto auto 1fr; align-items: center; }
  .hudleft > .goal, .hudleft > .bossbar { grid-column: 1 / -1; }
  .hudleft > .place { grid-column: 1 / -1; } /* its own row, so the names never squeeze the wave chip */
  .hudleft > .wave { min-width: min-content; } /* the place bar gives way before the wave chip shrinks under Pause */
}
.cardhead h2 { margin: 0; font-size: 1.15rem; color: var(--copper-hi); flex: 1; }
.cardhead .namecol { flex: 1 1 auto; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
.cardhead .namecol h2 { flex: none; }
.cardhead .lv { color: var(--muted); font-size: .85rem; white-space: nowrap; flex: none; } /* "Level / 20" split in two beside a long name (review of 2026.11.22-8) */
.stat { display: flex; justify-content: space-between; align-items: center; min-height: 36px; padding: 6px 10px; background: var(--panel-2); border: 2px solid var(--line); color: var(--ink); cursor: pointer; text-align: left; }
.stat b { color: var(--gold); }
.explain { display: grid; gap: 2px; padding: 6px 10px; background: var(--line); font-size: .85rem; }
.explain div { display: flex; justify-content: space-between; }
/* tap a number, see where it comes from (src/ui/explain.js) */
.explain.why { gap: 1px; padding: 6px 10px; background: #1f150f; border: 2px solid var(--line); }
.explain.why div { gap: 10px; }
.explain.why span { color: var(--muted); }
.explain.why b { color: var(--ink); font-weight: 600; white-space: nowrap; }
.explain .total { margin-top: 3px; padding-top: 3px; border-top: 2px solid var(--line); }
.explain .total span, .explain .total b { color: var(--gold); }
.explain .statrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; margin: 0 -6px; padding: 0 6px; background: none; border: 0; border-bottom: 2px dotted #5a4030; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.explain .statrow.on { background: #1f150f; }
.explain .statrow b::after, .stat b::after { content: ""; display: inline-block; width: 5px; height: 5px; margin: 0 2px 1px 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); }
.explain .statrow.on b::after, .stat[aria-expanded="true"] b::after { transform: rotate(45deg); margin-bottom: 3px; }
/* a stat's chevron rides at the end of its value and never wraps onto a line of its own (review of 2026.11.23-7:
   "One every 2 seconds" then a lone chevron) */
.explain .statrow b { position: relative; padding-right: 14px; }
.explain .statrow b::after { position: absolute; right: 2px; bottom: .45em; margin: 0; }
.explain .statrow.on b::after { bottom: .3em; margin: 0; }
.tapwhy { cursor: pointer; }
.coins { cursor: pointer; }
.vaultbtn { display: inline-flex; flex-direction: row; justify-content: center; align-items: center; gap: 4px; min-height: 30px; padding: 0; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
.uses { margin: 0; color: var(--muted); font-size: .9rem; }
.warn { margin: 0; color: var(--bad); font-size: .9rem; }
.pathnotes { display: grid; gap: 2px; } .pathnotes:empty { display: none; }
.pathnotes > p { margin: 0; font-size: .85rem; line-height: 1.3; } /* why the Choose buttons are gray, under the price (review of 2026.11.24-2) */
.card > p.uses, .card > p.warn { font-size: .85rem; line-height: 1.3; } /* a tower card's short-of-goods note stays whole over the pinned price (2026.11.21-10: three lines on a Rocket Battery card ran under it) */
.card .row { justify-content: stretch; }
/* the Build or Upgrade row never scrolls out of view: it sticks to the card's bottom edge while the card scrolls */
/* its top edge shows it is pinned over the lines that scroll under it (review of 2026.11.19-8: the card's last line looked cut) */
/* the map card's Play or Start stays whole at the card's foot while the card scrolls (clarity fix 8b: a long outpost card in
   landscape scrolled Play half out of view) */
.card > .row:has(> #buy), .card > .buybar, #mapCard > .row:has(> #mapPlay, > #mapFound) { position: sticky; bottom: -12px; z-index: 1; margin: 0 -12px; padding: 6px 12px; background: var(--panel); border-top: 2px solid var(--line); box-shadow: 0 -3px 0 rgba(22, 15, 11, .35); }
/* more below a card's edge (play.js cardMore): a shade at its foot, or just above its pinned buy bar */
.card.more::after { content: ''; position: sticky; bottom: -12px; z-index: 2; height: 18px; margin: -26px -12px 0; pointer-events: none; background: linear-gradient(rgba(14, 9, 6, 0), rgba(14, 9, 6, .55)); }
.card.morepin > .row:has(> #buy), .card.morepin > .buybar { box-shadow: 0 -3px 0 rgba(22, 15, 11, .35), 0 -24px 16px -8px rgba(14, 9, 6, .8); }
.card > .buybar { display: grid; gap: 6px; }
.card > .buybar.pathbar { position: static; margin: 0; padding: 0; border-top: 0; box-shadow: none; }
.card > .buybar .costrow { margin-top: 0; }
.card .buy { flex: 1; font-size: 1.05rem; text-wrap: balance; }
/* the price stays on one line beside a small switch, which wraps its words instead (review of 2026.11.19-9: "Upgrade · 10.5K coins" broke in two in landscape) */
.card .row:has(> .buy) { flex-wrap: nowrap; }
.card .row > .buy { white-space: nowrap; flex: 1 0 auto; }
.card .row:has(> .buy) > .btn.small { flex: 0 1 auto; min-width: 0; white-space: normal; text-wrap: balance; }
.card .row.sellrow { flex-wrap: wrap; } /* a building's Sell switch never breaks inside: it moves under Upgrade when both do not fit (review of 2026.11.19-11) */
.card .row.sellrow > #sell { white-space: nowrap; flex: 1 0 auto; }
.card .keeprow { align-items: center; justify-content: space-between; gap: 8px; }
.card .keeprow .uses { flex: 1; font-size: .85rem; }
.card .switchrow { flex-wrap: wrap; justify-content: flex-start; } /* Sell and Keep for towers, each on one line */
.card .switchrow > .btn { white-space: nowrap; }
.costrow .costfor { color: var(--muted); font-size: .8rem; align-self: center; }
.card .keeprow .costrow { margin: 0 0 0 auto; } /* a price sits right beside its button (Hire foreman) */
/* a short landscape screen: a tighter card, so a tower's stats, its kept goods line and the pinned Upgrade row fit
   without scrolling (review of 2026.11.19-10: the kept goods line sat half under the pinned cost row) */
@media (orientation: landscape) and (max-height: 500px) {
  .card { gap: 5px; }
  .card .explain { padding-block: 3px; }
  .card .explain .statrow { min-height: 30px; }
  /* a tower's tappable stats two to a row, the name small over the value, so the Sell button under them shows above
     the pinned Upgrade bar (review of 2026.11.20-11: Sell was a sliver under the cost bar) */
  .card > .explain:not(.why) { grid-template-columns: auto auto auto; justify-content: space-between; column-gap: 6px; } /* three stats to a row, each column as wide as its words need, so the stats sit over the pinned price (2026.11.21-10) */
  .card > .explain:not(.why) > div { grid-column: 1 / -1; }
  .card > .explain:not(.why) .statrow { flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; min-height: 34px; margin: 0; padding: 1px 4px; }
  .card > .explain:not(.why) .statrow > span { font-size: .72rem; color: var(--muted); line-height: 1.1; }
  .card > .explain:not(.why) .statrow > b { line-height: 1.2; }
  /* Best against and the other plain stats: the name small over the value too (review of 2026.11.20-13: Best against sat
     in one row, name left and value right, under stats laid out the other way) */
  .card > .explain:not(.why) > .statline { grid-column: auto; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 0; min-height: 34px; padding: 1px 4px; }
  .card > .explain:not(.why) > .statline > span { font-size: .72rem; color: var(--muted); line-height: 1.1; }
  .card > .explain:not(.why) > .statline > b { line-height: 1.2; text-align: left; }
  .card > .buybar { gap: 4px; padding-block: 4px; }
  /* the price and Upgrade come last, pinned to the bottom edge, and the switches scroll under them, so nothing shows
     cut below the pinned bar (review of 2026.11.20-13: Sell spare timber and Keep for towers cut at the bottom) */
  .card > .buybar:not(.pathbar) { order: 99; }
  .card .row > .buy { min-height: 38px; padding-block: 4px; font-size: 1.1rem; }
  .card .row > .btn.small { min-height: 34px; }
  .card > p.uses { font-size: .82rem; line-height: 1.25; }
  .card > p > .more { display: none; } /* only how long, not which building: the red have in the price bar says what is short */
  .pathnotes > p { font-size: .8rem; line-height: 1.2; } /* every short good keeps its line on a choice card: its buttons say nothing else */
  /* a building's switches side by side, each label free to take two lines, and the foreman's line small beside its
     switch, so a level-10 card fits over the pinned price (review of 2026.11.23-7: the foreman row sat under it at 860x400) */
  .card .switchrow { flex-wrap: nowrap; gap: 6px; }
  .card .switchrow > .btn.switch, .card .keeprow > .btn.switch { flex: 1 1 0; min-width: 0; white-space: normal; text-align: left; justify-content: space-between; gap: 6px; line-height: 1.15; min-height: 34px; padding-block: 2px; }
  .card .keeprow > .btn.switch:only-child { flex: 0 1 auto; }
  .card .keeprow > .uses { flex: 1.3 1 0; font-size: .76rem; line-height: 1.2; }
  .card .keeprow > .uses:empty { display: none; }
  .card .switchrow .pip, .card .keeprow .pip { flex: none; }
  /* a building card with switches as wide as a tower card, so each switch's label takes at most two lines */
  @media (min-width: 760px) { .card:has(> .switchrow) { width: min(54%, 480px); } } /* under 760 it would cover the goal */
  @media (max-height: 390px) {
    .card .stat { min-height: 30px; padding-block: 2px; }
    .card .switchrow > .btn.switch, .card .keeprow > .btn.switch { min-height: 30px; font-size: .78rem; padding-inline: 6px; }
    .card .keeprow:has(> .btn.switch) > .uses { display: none; } /* the foreman's switch stays, its status line goes */
    .card > p.uses:has(+ .keeprow > #hireForeman) { display: none; } /* and Hire foreman with its price, without its line */
    .card .keeprow > .btn.small { min-height: 30px; }
    .cardhead { padding-bottom: 2px; }
  }
  /* the price sits beside Upgrade, not over it, so the pinned bar takes one row (2026.11.23-9: at 667x375 and 932x430
     a level-10 building card's rows sat under a two-row bar) */
  .card > .buybar:not(.pathbar) { grid-template-columns: auto 1fr; align-items: center; column-gap: 10px; }
  .card > .buybar:not(.pathbar) > .costrow { margin: 0; }
  .card > .buybar:not(.pathbar) > :not(.costrow) { grid-column: 2; grid-row: 1; }
  .card > .buybar:not(.pathbar) > .costrow ~ :not(.row) { grid-column: 1 / -1; grid-row: auto; }
  /* a breakdown opened on a card takes two columns, so its last rows stay over the pinned price (review of
     2026.11.23-7: the why-tower card's bar covered its last rows); the total spans both */
  .card .explain.why { grid-template-columns: 1fr 1fr; column-gap: 16px; row-gap: 0; padding-block: 3px; }
  .card .explain.why > div { min-height: 0; line-height: 1.3; font-size: .86rem; }
  .card .explain.why > .total { grid-column: 1 / -1; }
  /* a wider card for the path choice, the two paths side by side, so both show without scrolling (review of
     2026.11.20-3: Shrapnel was below the fold while most of the screen was map). Every other card keeps to 46%, so the
     map stays the bigger half (review of 2026.11.20-12: landscape cards covered the right half) */
  .card:has(> .cardhead > .sellhead) { width: min(54%, 480px); }
  .card:has(> .pathbar), .card:has(> .pathbar):has(> .cardhead > .sellhead) { width: min(60%, 520px); } /* each side's name fits on one line beside its Choose button (clarity fix 8b) */ /* a tower card too: its name and three stats a row fit on one line each (2026.11.21-10) */
  .card > .pathbar { grid-template-columns: 1fr 1fr; }
  .card > .pathbar > .pathhead, .card > .pathbar > .pathnotes { grid-column: 1 / -1; }
  .pathnotes > p > .more { display: none; } /* how long or what to build, one line a good: which building to upgrade is the red have's job */
  .card > .pathbar > .option { flex-direction: column; align-items: stretch; gap: 4px; }
  .card > .pathbar > .option > .btn { min-height: 32px; }
  /* Choose sits beside the name, the words under both, and Can't be undone beside Pick an upgrade, so both Choose
     buttons show without scrolling on a short screen (review of 2026.11.21-8, fork-land: Choose was under the fold) */
  .card > .pathbar > .option { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 6px; row-gap: 2px; }
  .card > .pathbar > .option > div { display: contents; }
  .card > .pathbar > .option > div > b { grid-column: 1; grid-row: 1; white-space: nowrap; } /* one line beside Choose (clarity fix 8b: "Rocket / Battery") */
  .card > .pathbar > .option > div > span { grid-column: 1 / -1; grid-row: 2; font-size: .8rem; line-height: 1.2; }
  .card > .pathbar > .option > .btn { grid-column: 2; grid-row: 1; min-height: 30px; padding-inline: 8px; }
  .card > .pathbar > .pathhead > div:first-child { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; }
}

.option small.soon, .soon { color: var(--ink); }
.option span.worse { color: var(--bad); }

.perks .pair { display: grid; gap: 4px; }

.charterline span { font-size: .85rem; font-weight: 500; }
.toast {
  position: fixed; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 56px)); transform: translateX(-50%); z-index: 30;
  width: max-content; max-width: calc(100% - 32px); padding: 8px 12px; background: var(--line); color: var(--ink); border: 2px solid var(--copper);
  box-shadow: 3px 3px 0 rgba(22, 15, 11, .6); animation: riseX .3s both; transition: opacity .2s; pointer-events: none;

.toast.out { opacity: 0; }
.toast, p { text-wrap: pretty; } /* no lone last word on a line (review of 2026.11.23-9: Kegs. and Influence. alone) */
/* every line on a card or a sheet too, not only paragraphs (review of 2026.11.23-10: "Influence." alone under the

.card *, .sheet *, .coachcard *, li { text-wrap-style: pretty; }
.mapkeep { position: fixed; visibility: hidden; pointer-events: none !important; } /* the capitol's box on the map: toasts keep off it */
.toast.wait, .mapbadge.undertoast, .tag.undertoast { visibility: hidden; } /* no room to show it yet: it waits with its time stopped (src/ui/play.js) */
/* a dot on a button: something there wants you (src/core/reveal.js) */
